add_newline = false

format = """
$username\
$container\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$package\
$cmake\
$cpp\
$golang\
$lua\
$nodejs\
$python\
$rust\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_frappe"

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"

[container]
disabled = false
format = '[$symbol]($style) '
symbol = "🐳"
style = "bold flamingo"

[character]
success_symbol = "[➜](bold peach)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[❮](bold peach)"

[directory]
style = "bold pink"
truncation_length = 3
truncate_to_repo = true
home = "~"
home_symbol = "󰋜 "
truncation_symbol = "󰋜 "
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold red"

[username]
style_user = "bold rosewater"
format = "[$user]($style) "
disabled = false
show_always = true
aliases = { "545411" = "jiazel" }

[hostname]
ssh_only = false
format = "[$ssh_symbol$hostname]($style) "
style = "bold flamingo"
ssh_symbol = "󰅟 "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold mauve"

[git_commit]
commit_hash_length = 7
format = "[$hash]($style) "
style = "bold rosewater"
only_detached = false
tag_disabled = false
tag_symbol = " 󰓹 "

[git_state]
format = "[$state($progress_current/$progress_total)]($style) "
style = "bold peach"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "bold pink"
conflicted = " 🏳"
ahead = " ⇡"
behind = "⇣"
diverged = "⇕"
stashed = " 📦"
modified = " !"
staged = " +"
renamed = " »"
deleted = " ✗"
untracked = " ?"

[package]
format = "[$symbol$version]($style) "
symbol = "󰏗 "
style = "bold peach"

[cmd_duration]
disabled = true

[cmake]
format = "[$symbol$version]($style) "
symbol = "△ "
style = "bold pink"

[cpp]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold flamingo"

[golang]
format = "[$symbol($version)]($style) "
symbol = " "
style = "bold mauve"

[lua]
format = "[$symbol($version)]($style) "
symbol = " "
style = "bold pink"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = "󰎙 "
style = "bold peach"

[python]
format = "[$symbol$pyenv_prefix($version)(\\($virtualenv\\))]($style) "
symbol = "󰌠 "
style = "bold yellow"
pyenv_version_name = false

[rust]
format = "[$symbol($version)]($style) "
symbol = "󱘘 "
style = "bold red"
